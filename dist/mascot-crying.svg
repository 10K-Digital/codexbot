<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Codexbot sem conexão"><defs><linearGradient id="jade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cbf5ab"/><stop offset=".45" stop-color="#67c892"/><stop offset="1" stop-color="#196d54"/></linearGradient><radialGradient id="face"><stop stop-color="#c8f2af"/><stop offset="1" stop-color="#76c992"/></radialGradient><path id="loop" d="M64 20C84 6 109 26 98 47L80 78C75 87 60 80 66 69L82 42C89 30 73 23 64 34Z"/></defs><style>.ring{transform-origin:64px 64px;animation:sob 2.8s ease-in-out infinite}.petal{animation:wave 3s ease-in-out infinite;transform-origin:64px 64px}.eye{transform-origin:78px 56px;animation:blink 4.8s infinite}.smile{transform-origin:64px 74px;animation:smile 4s ease-in-out infinite}@keyframes sob{50%{transform:translateY(3px) rotate(-3deg)}}.tear{fill:#5ba9bd;stroke:none;animation:tear 1.8s ease-in infinite}.tear.second{animation-delay:-.9s}@keyframes tear{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(21px);opacity:0}}@keyframes wave{50%{transform:scale(1.035)}}@keyframes blink{0%,42%,48%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}@keyframes smile{50%{transform:scale(1.08,1.16)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="ring" fill="url(#jade)" stroke="#235d4933" stroke-width="1"><g transform="rotate(0 64 64)"><use href="#loop" class="petal" style="animation-delay:-0s"/></g><g transform="rotate(60 64 64)"><use href="#loop" class="petal" style="animation-delay:-0.3s"/></g><g transform="rotate(120 64 64)"><use href="#loop" class="petal" style="animation-delay:-0.6s"/></g><g transform="rotate(180 64 64)"><use href="#loop" class="petal" style="animation-delay:-0.8999999999999999s"/></g><g transform="rotate(240 64 64)"><use href="#loop" class="petal" style="animation-delay:-1.2s"/></g><g transform="rotate(300 64 64)"><use href="#loop" class="petal" style="animation-delay:-1.5s"/></g></g><